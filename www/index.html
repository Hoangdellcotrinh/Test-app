<!DOCTYPE html>

<title>SAT Lì Đòn</title>
<style>
:root{--bg:#12141a;--cd:#1b1f28;--ln:#2b3140;--tx:#e9ecf3;--mt:#8a93a6;--ac:#7aa2ff;--gr:#3ddc97;--rd:#ff6b7a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100dvh}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:env(safe-area-inset-top) 14px 0}
#bar{height:4px;background:var(--ln);border-radius:2px;overflow:hidden;margin-top:8px}
#pf{display:block;height:100%;background:var(--gr);transform-origin:left;transform:scaleX(0);transition:transform .3s}
#hd{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px;color:var(--mt)}
#hd span{flex:1}#cb{color:#ffb454;font-weight:700;flex:0 0 auto!important}
main{max-width:640px;margin:0 auto;padding:6px 14px 40px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:10px 14px}
button{cursor:pointer;min-height:46px;transition:transform .08s,background .15s}
button:hover:not(:disabled){background:#242a36}button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:20px;animation:in .18s ease-out;transition:box-shadow .15s}

.ok{box-shadow:0 0 0 2px var(--gr)}.no{box-shadow:0 0 0 2px var(--rd)}
.lb{color:var(--mt);font-size:13px;margin:14px 0 6px}.card>.lb:first-child{margin-top:0}
h1{font-size:clamp(28px,8vw,44px);text-align:center;margin:18px 0;word-break:break-word;font-weight:650}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.g button{text-align:left;display:flex;gap:10px;align-items:center}
.g b{color:var(--ac);flex:0 0 auto}
.g1{background:#173a2c!important;border-color:var(--gr)}.r1{background:#431d24!important;border-color:var(--rd)}.n{opacity:.5}
.tb{height:4px;background:var(--ln);border-radius:2px;overflow:hidden}
.tb i{display:block;height:100%;background:var(--ac);transform-origin:left;animation:tb linear forwards}
@keyframes tb{to{transform:scaleX(0)}}
.row{display:flex;gap:8px}.row select{flex:1;min-width:0}
.chips,.bt{display:flex;flex-wrap:wrap;gap:8px}
.chips .on{background:var(--ac);color:#0b1020;border-color:var(--ac)}
.bt button{flex:1 0 28%;display:flex;flex-direction:column;align-items:center}.bt small{color:var(--mt)}
details{margin-top:16px}summary{cursor:pointer;color:var(--ac);padding:8px 0}
textarea{width:100%;height:120px;margin:8px 0;resize:vertical}input[type=text],#tx{width:100%}
.in{margin-top:14px;padding:12px;border-radius:10px;background:#242a36;font-size:15px}.in small{color:var(--mt)}
#fb button{width:100%;margin-top:12px;background:var(--ac);color:#0b1020;border:0;font-weight:600}
.hint{text-align:center;font:600 26px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;margin-bottom:14px}
#ti{width:100%;font-size:22px;text-align:center}
.pr{text-align:center;color:var(--mt)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two .y{background:#173a2c;border-color:var(--gr)}.two .x{background:#431d24;border-color:var(--rd)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt div{display:grid;gap:8px}
.mt button{text-align:left;transition:opacity .25s,transform .25s}
.mt .s{border-color:var(--ac);background:#202b45}.mt .w{border-color:var(--rd)}
.gone{opacity:0;transform:scale(.6);pointer-events:none}
#an{min-height:60px;text-align:center;font:600 30px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;cursor:pointer;margin:10px 0}
.tl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.tl button{min-width:46px;font:600 20px ui-monospace,monospace;text-transform:lowercase}.tl .u{opacity:.2;pointer-events:none}
table{width:100%;border-collapse:collapse;margin-top:8px}td{padding:6px 4px;border-bottom:1px solid var(--ln);font-size:15px}
.stat{display:flex;gap:10px;margin:14px 0}.stat div{flex:1;background:#242a36;border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:24px}
@media(max-width:480px){.g{grid-template-columns:1fr}.card{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
